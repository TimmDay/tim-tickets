# tim-tickets' own copy of docs/agent-workflow.yml (the template other epic repos copy) —
# keep the two in sync.
#
# Triggered by tim-tickets' "Release the bots" button (a repository_dispatch). Claude works the
# ticket on a fresh branch, the workflow opens a PR, then reports back to tim-tickets, which
# comments on the ticket and moves it to In Review.
#
# Repo setup:
#   Secrets:  CLAUDE_CODE_OAUTH_TOKEN  (from `claude setup-token`)
#             TIM_TICKETS_AGENT_TOKEN  (same value as tim-tickets' AGENT_API_TOKEN)
#             VERCEL_PROTECTION_BYPASS (optional: Vercel → Settings → Deployment Protection →
#                                       Protection Bypass for Automation; lets report-back reach
#                                       protected preview deployments)
#   Settings → Actions → General → Workflow permissions:
#             tick "Allow GitHub Actions to create and approve pull requests"
# Pair with docs/agent-merged-workflow.yml to move tickets to Done when you merge the agent's PR.
# Secret expiry/rotation and troubleshooting: docs/agent-secrets.md in tim-tickets.
name: tim-tickets agent

on:
  repository_dispatch:
    types: [tim-tickets-agent]

permissions:
  contents: write
  pull-requests: write

# One run per ticket at a time; a re-dispatch waits for the previous run rather than racing it.
concurrency:
  group: tim-tickets-agent-${{ github.event.client_payload.ticketKey }}

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Payload fields go through env vars, never inlined into shell scripts, so ticket text
      # can't inject commands.
      TICKET_KEY: ${{ github.event.client_payload.ticketKey }}
      TICKET_TITLE: ${{ github.event.client_payload.title }}
      REPORT_URL: ${{ github.event.client_payload.reportUrl }}
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # Scratch folder for files passed between the workflow and Claude (screenshot in,
      # result.json out). Git-excluded in "Create branch", so nothing in it is ever committed.
      AGENT_DIR: .tim-tickets
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create branch
        id: branch
        run: |
          branch="agent/${TICKET_KEY}-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          git config user.name "tim-tickets agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "name=$branch" >> "$GITHUB_OUTPUT"
          mkdir -p "$AGENT_DIR"
          echo "$AGENT_DIR/" >> .git/info/exclude

      - name: Download screenshot
        id: screenshot
        if: github.event.client_payload.screenshotUrl != ''
        env:
          SCREENSHOT_URL: ${{ github.event.client_payload.screenshotUrl }}
          AGENT_TOKEN: ${{ secrets.TIM_TICKETS_AGENT_TOKEN }}
          VERCEL_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
        run: |
          # Saved inside the checkout (Claude can Read files there), in the git-excluded AGENT_DIR.
          dir="$AGENT_DIR"
          headers=(-H "Authorization: Bearer ${AGENT_TOKEN}")
          if [ -n "$VERCEL_BYPASS" ]; then
            headers+=(-H "x-vercel-protection-bypass: ${VERCEL_BYPASS}")
          fi
          if ! content_type=$(curl --fail -sS "${headers[@]}" -o "$dir/download" -w '%{content_type}' "$SCREENSHOT_URL"); then
            # A missing screenshot is context lost, not a reason to abandon the run.
            echo "::warning::Couldn't download the ticket's screenshot; continuing without it."
            exit 0
          fi
          case "$content_type" in
            image/png*) ext=png ;;
            image/jpeg*) ext=jpg ;;
            image/webp*) ext=webp ;;
            *) echo "::warning::Unexpected screenshot type '$content_type'; continuing without it."; exit 0 ;;
          esac
          mv "$dir/download" "$dir/screenshot.$ext"
          echo "path=$dir/screenshot.$ext" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: >-
            ${{ github.event.client_payload.model && format('--model {0}', github.event.client_payload.model) || '' }}
            --allowedTools "Bash(git add:*),Bash(git commit:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(npm:*),Bash(npx:*),Edit,Write,Read,Glob,Grep"
          prompt: |
            You are working on ticket ${{ github.event.client_payload.ticketKey }} from a personal issue tracker.

            Title: ${{ github.event.client_payload.title }}

            Body:
            ${{ github.event.client_payload.body }}

            This ticket is part of the epic "${{ github.event.client_payload.epicName }}".
            Epic description (may be empty):
            ${{ github.event.client_payload.epicDescription }}

            Comments on the ticket, oldest first (may be empty; later ones may refine or override
            the body):
            ${{ github.event.client_payload.comments }}

            ${{ steps.screenshot.outputs.path && format('A screenshot is attached to the ticket at {0}. View it with the Read tool before starting; it shows what the ticket is about.', steps.screenshot.outputs.path) || '' }}

            Implement the ticket in this repository. Follow the repo's CLAUDE.md / conventions if
            present, and run its lint/build/tests if available. Commit your work on the current
            branch with Conventional Commit messages. Do not push or open a PR — a later workflow
            step does that. If the ticket is unclear or needs no code change, make no commits.

            If you find that everything the ticket asks for is ALREADY implemented in this
            repository, make no commits and instead write the file .tim-tickets/result.json
            containing exactly: {"outcome": "already_done", "reason": "<one or two sentences
            saying where and how it is already implemented>"}. Only do this when you have checked
            the code and are confident; if just some of it exists, implement the rest instead.

      - name: Open PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git log "origin/${BASE_BRANCH}..HEAD" --oneline)" ]; then
            # No commits: either Claude judged the work already done (and said so in
            # result.json, per the prompt) or there was simply nothing to change.
            if jq -e '.outcome == "already_done"' "$AGENT_DIR/result.json" > /dev/null 2>&1; then
              echo "outcome=already_done" >> "$GITHUB_OUTPUT"
            else
              echo "outcome=no_changes" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          git push -u origin "${{ steps.branch.outputs.name }}"
          pr_url=$(gh pr create --base "$BASE_BRANCH" --title "${TICKET_KEY}: ${TICKET_TITLE}" \
            --body "Automated implementation of ${TICKET_KEY}. Workflow run: ${RUN_URL}")
          echo "outcome=pr_opened" >> "$GITHUB_OUTPUT"
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Report back to tim-tickets
        if: always()
        env:
          AGENT_TOKEN: ${{ secrets.TIM_TICKETS_AGENT_TOKEN }}
          VERCEL_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
          OUTCOME: ${{ steps.pr.outputs.outcome || 'failed' }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          if [ "$OUTCOME" = "pr_opened" ]; then
            payload=$(jq -n --arg url "$PR_URL" '{outcome: "pr_opened", prUrl: $url}')
          elif [ "$OUTCOME" = "already_done" ]; then
            # Claude's reason, as plain text, capped to what the app accepts.
            reason=$(jq -r '.reason // "" | tostring | .[0:2000]' "$AGENT_DIR/result.json" 2>/dev/null || true)
            payload=$(jq -n --arg reason "$reason" --arg run "$RUN_URL" '{outcome: "already_done", reason: $reason, runUrl: $run}')
          else
            payload=$(jq -n --arg outcome "$OUTCOME" --arg run "$RUN_URL" '{outcome: $outcome, runUrl: $run}')
          fi
          headers=(-H "Authorization: Bearer ${AGENT_TOKEN}" -H "Content-Type: application/json")
          # Vercel Deployment Protection blocks unauthenticated requests to preview deployments
          # before they reach the app; this header lets the report-back through.
          if [ -n "$VERCEL_BYPASS" ]; then
            headers+=(-H "x-vercel-protection-bypass: ${VERCEL_BYPASS}")
          fi
          curl --fail-with-body -sS -X POST "$REPORT_URL" "${headers[@]}" -d "$payload"
